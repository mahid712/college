<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Variables */
        :root {
            --primary-color: #8B0000;
            --text-dark: #333333;
            --text-light: #666666;
            --bg-light: #f8f9fa;
            --border-color: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: var(--text-dark);
            background-color: var(--bg-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .not-found-page {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .not-found-container {
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            text-align: center;
            max-width: 500px;
            width: 100%;
            position: relative;
        }

        .icon-wrapper {
            font-size: 50px;
            color: var(--primary-color);
            margin-bottom: 20px;
            background: rgba(139, 0, 0, 0.08);
            width: 90px;
            height: 90px;
            line-height: 90px;
            border-radius: 50%;
            margin-left: auto;
            margin-right: auto;
        }

        .error-code {
            font-size: 4rem;
            font-weight: 800;
            color: var(--primary-color);
            margin: 0 0 10px 0;
            line-height: 1;
        }

        h2 {
            font-size: 1.5rem;
            color: var(--text-dark);
            margin-bottom: 15px;
            font-weight: 700;
        }

        p {
            font-size: 0.95rem;
            color: var(--text-light);
            line-height: 1.6;
            margin: 0;
        }

        .trademark {
            margin-top: 35px;
            font-size: 0.8rem;
            color: var(--text-light);
            letter-spacing: 0.5px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="not-found-page">
        <div class="not-found-container">
            <div class="icon-wrapper">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h1 class="error-code">404</h1>
            <h2>Page Not Found</h2>
            <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
            
            <!-- Custom Trademark -->
            <div class="trademark">
                &copy; 2026 Department Portal &trade; &bull; All Rights Reserved
            </div>
        </div>
    </div>

</body>
</html>
