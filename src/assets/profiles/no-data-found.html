<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200">
    <title>404 - Data Not Found</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Using your specific variables */
        :root {
            --bg-main: #0B2447;
            --text-primary: #A5D7E8;
            --text-heading: #E5B8F4;
            --accent-glow: #8E05C2;
            --accent-royal: #810CA8;
            --accent-blue: #576CBC;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            background-image: linear-gradient(180deg, var(--bg-main) 0%, #1a1a2e 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            overflow: hidden;
        }

        .error-container {
            text-align: center;
            padding: 50px;
            background: linear-gradient(135deg, rgba(25, 55, 109, 0.6), rgba(62, 6, 95, 0.6));
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(229, 184, 244, 0.2);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 90%;
        }

        .error-code {
            font-size: 100px;
            font-weight: bold;
            color: var(--text-heading);
            text-shadow: 0 0 20px var(--accent-glow);
            margin: 0;
            line-height: 1;
        }

        .error-icon {
            font-size: 60px;
            color: var(--accent-blue);
            margin: 20px 0;
            display: block;
        }

        h2 {
            color: var(--text-heading);
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
            opacity: 0.8;
        }

        .back-btn {
            display: inline-block;
            background: linear-gradient(45deg, var(--accent-royal), var(--accent-blue));
            color: #ffffff;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(129, 12, 168, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .back-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(129, 12, 168, 0.6);
        }

        /* Subtle animated background circles */
        .circle {
            position: absolute;
            border-radius: 50%;
            background: var(--accent-royal);
            filter: blur(80px);
            z-index: -1;
            opacity: 0.3;
        }
    </style>
</head>
<body>

    <div class="circle" style="width: 300px; height: 300px; top: 10%; left: 10%;"></div>
    <div class="circle" style="width: 400px; height: 400px; bottom: 10%; right: 10%; background: var(--accent-blue);"></div>

    <div class="error-container">
        <span class="error-icon"><i class="fas fa-search-minus"></i></span>
        <h1 class="error-code">404</h1>
        <h2>Data Not Found</h2>
        <p>The information you are looking for has either been moved or doesn't exist in our records.</p>
        <a href="../department.html" class="back-btn"><i class="fas fa-home"></i> Back to Portal</a>
    </div>

</body>
</html>
